name: Monthly snapshot

# Pulls the live files from https://dailyaitools.ai/data/ and commits them.
# Runs inside this repo, so the built-in token can push and no secret is needed.
on:
  schedule:
    - cron: '0 15 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
      - name: Commit if anything changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name=dailyaitools -c user.email=admin@dailyaitools.ai \
            commit -m "Snapshot $(date -u +%Y-%m)"
          git push
